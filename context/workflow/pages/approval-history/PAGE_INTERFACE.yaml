## **审批历史页面 (`approval-history`) - 核心可执行测试用例**

### **用例组一：页面加载与基础交互**

| 用例ID | 场景参考 | 测试步骤 | 预期结果 (验证点) |
| :--- | :--- | :--- | :--- |
| **TC-01** | S-01 | 1. 使用有效凭证访问审批历史页面。<br>2. 等待页面完全加载。 | 1. 页面无JS控制台错误。<br>2. 所有筛选控件（`#timeRangeSelector`, `#statusFilter`, `#typeFilter`, `#initiatorSearch`）及按钮（`#searchBtn`, `#resetBtn`）均可见并处于默认状态。<br>3. 数据列表（`#approvalListTable`）开始加载，并在加载完成后显示数据。<br>4. 分页组件（`#pagination`）显示记录总数（>0）。 |
| **TC-02** | S-03 | 1. 在页面加载完成后，直接点击“查询”按钮（`#searchBtn`）。 | 1. 点击后，“查询”按钮进入加载状态（如显示loading图标）或变为禁用状态，防止重复提交。<br>2. 数据列表上方出现加载指示器（`#loadingSpinner`）。<br>3. 数据刷新完成后，加载指示器消失，列表显示最新数据。 |
| **TC-03** | S-04 | 1. 修改至少一个筛选条件（如选择“最近7天”）。<br>2. 点击“查询”按钮，确认列表数据已变化。<br>3. 点击“重置”按钮（`#resetBtn`）。 | 1. 所有筛选控件恢复为页面初始默认值（如时间范围恢复为默认选项，状态清空等）。<br>2. 数据列表自动恢复为TC-01中初始加载的数据集。 |

### **用例组二：筛选功能验证 (以“时间范围”为例)**

| 用例ID | 场景参考 | 测试步骤 | 预期结果 (验证点) |
| :--- | :--- | :--- | :--- |
| **TC-04** | S-05 | 1. 点击时间范围选择器（`#timeRangeSelector`）。<br>2. 从快捷选项中选择“最近7天”。<br>3. 点击“查询”。 | 1. 列表仅显示提交时间在“最近7天”内的记录。<br>2. 分页组件中的“共X条”记录数与列表行数一致，且≤7天内预期数据量。 |
| **TC-05** | S-06 | 1. 点击时间范围选择器，选择“自定义”。<br>2. 在日期选择器中选择一个有效的开始和结束日期（如：2024-03-01 至 2024-03-31）。<br>3. 点击“查询”。 | 1. 列表仅显示提交时间在2024年3月1日至3月31日之间的记录。<br>2. 检查列表中每条记录的时间是否都在该范围内。 |
| **TC-06** | S-07 | 1. 选择自定义日期范围，将结束日期设置为早于开始日期。<br>2. 尝试点击“查询”。 | 1. 日期选择器应进行校验，不允许选择无效范围，或“查询”按钮保持禁用状态。 |

