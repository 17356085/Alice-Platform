## **测试数据准备建议 (结合 `PAGE_CONTEXT.md` 第3节)**

为执行以上用例，测试环境数据库应至少包含：
1.  **基础数据**：100条审批记录，覆盖所有状态类型。
2.  **时间分布**：确保有“今天”、“昨天”、“最近7天内”、“3个月前”等时间点的记录。
3.  **特定发起人数据**：
    *   **张伟**：10条记录（用于验证模糊搜索和组合筛选）。
    *   **张伟明**：5条记录。
    *   **王伟**：1条记录（可配合其他条件用于制造空结果）。
4.  **组合记录**：例如“张伟”在“2024-01-15 10:30”发起的“已通过”的“报销审批”，用于精准验证。

这些测试用例覆盖了页面核心功能、边界条件和关键异常场景。在执行时，请优先运行 **P0** 级别的用例（如TC-01, TC-02, TC-04, TC-07, TC-09, TC-11），以确保主要流程的稳定性。