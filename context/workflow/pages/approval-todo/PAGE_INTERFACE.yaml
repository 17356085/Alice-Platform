### 3. 观察结论与说明

1.  **选择器策略**：为保证稳定性，优先推荐使用`data-testid`（如果开发已添加）。若无，则采用基于Ant Design组件结构或稳定文本（如按钮文字）的选择器。为表格行内元素添加了`:nth-child()`伪类以区分不同行。
2.  **元素状态验证**：许多元素的状态（如按钮的`disabled`、复选框的`checked/indeterminate`、分页器的页码`active`类）是测试重点，上述选择器均支持对这些状态进行断言。
3.  **数据依赖性**：页面表现（如操作按钮是否可用、空状态是否显示、表格内容）高度依赖于列表数据。在测试设计中需考虑预置必要的数据状态。
4.  **异步交互**：查询、翻页、审批操作等均涉及异步请求，测试脚本中必须包含等待网络请求完成或特定元素状态变化的逻辑。

此页面包含**14个**以上可测试元素，已满足要求。以上元素选择器为编写自动化测试脚本提供了坚实的基础。