### 2. 可测试元素详细列表

| 区域 | 元素描述 | 元素类型 | 推荐选择器 (CSS Selector) | 交互方式与测试关注点 |
| :--- | :--- | :--- | :--- | :--- |
| **筛选器** | 流程类型下拉框 | `Select` | `form [class*="processType"]` 或 `form [data-testid="filter-processType"]` | 点击展开选项列表，选择一个选项。测试值联动查询结果。 |
| **筛选器** | 状态下拉框 | `Select` | `form [class*="status"]` 或 `form [data-testid="filter-status"]` | 同上。 |
| **筛选器** | 关键词搜索输入框 | `Input` | `form input[placeholder*="关键词"]` 或 `form [data-testid="filter-keyword"]` | 输入文本，可测试回车触发查询或清空。 |
| **筛选器** | 开始日期选择器 | `DatePicker` | `form [data-testid="filter-startDate"]` | 点击弹出日历面板，选择日期。测试日期格式和值传递。 |
| **筛选器** | 结束日期选择器 | `DatePicker` | `form [data-testid="filter-endDate"]` | 同上。 |
| **筛选器** | **查询按钮** | `Button` | `form button:has-text(“查询”)` | **关键交互**。点击后触发列表数据刷新（伴随Loading状态）。 |
| **筛选器** | **重置按钮** | `Button` | `form button:has-text(“重置”)` | 点击后清空所有筛选项，恢复默认状态并可能重新查询。 |
| **表格** | **表头全选复选框** | `Checkbox` | `.ant-table-thead input[type=“checkbox“]` | 点击可全选/取消全选当前页所有行。测试其`indeterminate`（半选）状态。 |
| **表格** | **行选择复选框** | `Checkbox` | `.ant-table-tbody tr:nth-child({行号}) input[type=“checkbox“]` | 选择单行数据。测试其选中状态对批量操作按钮的影响。 |
| **表格** | **行操作-同意按钮** | `Button` | `.ant-table-tbody tr:nth-child({行号}) button:has-text(“同意“)` | **关键交互**。点击后通常需二次确认，然后执行同意操作（状态变更为“已同意”）。 |
| **表格** | **行操作-拒绝按钮** | `Button` | `.ant-table-tbody tr:nth-child({行号}) button:has-text(“拒绝“)` | **关键交互**。点击后通常需填写拒绝理由，然后执行拒绝操作。 |
| **表格** | **行操作-详情链接** | `Link` | `.ant-table-tbody tr:nth-child({行号}) a:has-text(“详情“)` | 点击后跳转至审批详情页面，并携带当前行的审批ID。 |
| **批量操作** | **批量同意按钮** | `Button` | `.batch-operation-bar button:has-text(“批量同意“)` | **关键交互**。在选中一行或多行后变为可点击状态（去除`disabled`）。点击后触发批量同意流程。 |
| **批量操作** | **批量拒绝按钮** | `Button` | `.batch-operation-bar button:has-text(“批量拒绝“)` | 同上，批量拒绝流程。 |
| **批量操作** | **批量转办按钮** | `Button` | `.batch-operation-bar button:has-text(“批量转办“)` | 同上，批量转办流程。 |
| **分页** | **上一页按钮** | `Button` | `.ant-pagination-prev` | 翻到上一页。在第一页时应为`disabled`状态。 |
| **分页** | **下一页按钮** | `Button` | `.ant-pagination-next` | 翻到下一页。在最后一页时应为`disabled`状态。 |
| **分页** | **页码列表** | `Item` | `.ant-pagination-item` | 可直接点击跳转至指定页码。当前页码项通常带有`active`类。 |
| **分页** | **总条数文本** | `Text` | `.ant-pagination-total-text` | 显示总记录数，如“共 23 条”。用于验证筛选或操作后数据量的变化。 |
| **反馈** | **全局Loading** | `Spin` | `.ant-spin-spinning` | 在发起查询、翻页、操作等异步请求时出现，操作完成后消失。需等待其隐藏后再进行断言。 |
| **反馈** | **操作成功提示** | `Message` | `.ant-message-success` | 执行同意、拒绝等操作后，顶部出现的成功提示信息。 |
| **反馈** | **空状态** | `Empty` | `.ant-empty` 或 `[data-testid=“empty-state“]` | 当筛选结果无数据时显示。包含图标和提示文字。 |

