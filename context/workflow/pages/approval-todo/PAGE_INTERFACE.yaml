## 页面观察报告：approval-todo

我已根据您提供的上下文信息，对 `approval-todo` 页面进行了观察。以下是提取的页面结构与核心可测试元素，已整理成 `PAGE_CONTEXT.md`。

### PAGE_CONTEXT.md

**页面名称：** 审批待办 (`approval-todo`)
**主要功能：** 展示用户待处理的审批列表，支持筛选、查询、单条/批量审批操作、查看详情以及翻页。

---

### 1. 页面整体布局与核心区域

页面采用常见的后台管理列表页布局，从上到下主要分为以下四个功能区域：

```html
<div class="approval-todo-page">
  <!-- 区域1：筛选器与操作栏 -->
  <div class="filter-bar">
    <form> ... </form>
    <div class="action-buttons"> ... </div>
  </div>

  <!-- 区域2：数据表格 -->
  <div class="table-container">
    <table class="ant-table"> ... </table>
  </div>

  <!-- 区域3：批量操作栏 (通常在表格上方或下方，此处以下方为例) -->
  <div class="batch-operation-bar"> ... </div>

  <!-- 区域4：分页器 -->
  <div class="pagination-container">
    <ul class="ant-pagination"> ... </ul>
  </div>
</div>
```

