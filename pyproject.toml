[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aitest"
version = "1.6.0"
description = "AI 自动化测试平台 — 去平台化 CLI 工具包"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # Data validation
    "pydantic>=2.0",
    # Database
    "sqlalchemy>=2.0",
    "chromadb>=0.4.0",
    # AI / LLM
    "langgraph>=0.2.0",
    "anthropic>=0.30.0",
    "openai>=1.0",
    # Config & serialization
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # HTTP
    "httpx>=0.27.0",
    # CLI
    "typer>=0.9.0",
    "rich>=13.0.0",
    # Optional: browser automation
    "browser-use>=0.1.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
metrics = [
    "prometheus-client>=0.19.0",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]

[project.scripts]
aitest = "aitest.cli.main:main"
alice = "aitest.cli.main:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
# 开发模式: aitest 和 alice-engine 都用 editable install
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["aitest*"]

[tool.pytest.ini_options]
testpaths = ["aitest/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "slow: Slow tests (real LLM, browser, network) — skipped in CI fast mode",
    "integration: Integration tests (multiple modules, real DB/Redis)",
    "unit: Unit tests (single module, all deps mocked)",
    "llm: Tests that require a real LLM API key (not mocked)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["aitest"]
omit = [
    "aitest/tests/*",
    "aitest/web/*",
    "aitest/tools/*",
    "aitest/infra/cli/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "def __repr__",
    "def __str__",
]
fail_under = 0  # raise once we hit 20%
