<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TLO — Testing Lifecycle Orchestrator</title>

  <!-- Mahoyo: 洋書の活字 · Lora serif for headings -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Anti-flash: set theme before paint -->
  <script>
    (function() {
      var t = localStorage.getItem('tlo-theme-name') || 'default'
      var d = localStorage.getItem('tlo-theme') === 'dark'
      document.documentElement.setAttribute('data-theme', t)
      if (d) document.documentElement.classList.add('dark')
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
