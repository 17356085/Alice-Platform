# AITest Platform v1.0 — CI + Release Pipeline
#
# Push/PR: Lint → Test → Build
# Tag v*:  Test → Build → Push to GHCR → Create Release

name: CI

on:
  push:
    branches: [master, main, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install workspace packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            ./packages/alice-governance \
            ./packages/alice-discovery \
            ./packages/alice-engine \
            .
          python -m pip install pytest pytest-asyncio
          python -m pip check

      - name: Smoke import installed packages
        run: |
          python - <<'PY'
          import aitest
          import alice_discovery
          import alice_engine
          import alice_governance
          from alice_governance import get_pack_path

          print("workspace imports OK")
          print(get_pack_path())
          PY

      - name: Collect tests
        run: python -m pytest --collect-only -q -p no:cacheprovider aitest/tests packages/alice-engine/tests

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider -m "not slow and not llm" packages/alice-engine/tests aitest/tests

      - name: Check engine has no platform imports
        run: |
          result=$(grep -R -nE "\b(from|import) aitest(\.|$)" packages/alice-engine/ --include="*.py" | grep -v "__pycache__" | grep -v "tests/" || true)
          if [ -n "$result" ]; then
            echo "ERROR: alice_engine package must not import from aitest:"
            echo "$result"
            exit 1
          fi
          echo "OK: zero aitest imports in alice_engine"

  sdk-standalone:
    name: SDK Standalone (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build alice-engine wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel packages/alice-engine

      - name: Install wheel in clean env
        run: |
          python -m venv .sdk-standalone
          . .sdk-standalone/bin/activate
          python -m pip install --upgrade pip
          python -m pip install packages/alice-engine/dist/alice_engine-*.whl

      - name: Standalone wheel smoke
        run: |
          . .sdk-standalone/bin/activate
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib
          import importlib.util

          assert importlib.util.find_spec("aitest") is None

          import alice_engine
          bridge = importlib.import_module("alice_engine.platform_bridge")

          from alice_engine import ExecutionContext, ExecutionResult, InlineExecutionKernel, KernelExecutionRequest
          from alice_engine.behavior import load_behavior_pack
          from alice_engine.router import GovernanceRouter, Source

          pack = load_behavior_pack(None)
          assert pack.root is not None
          assert pack.skills_dir is not None
          assert pack.agents_yaml is not None

          router = GovernanceRouter(auto_discover=True)
          skill = router.resolve_skill("project/context-sync")
          agent = router.resolve_agent_skills("project-agent")
          assert skill.found is True
          assert skill.source is Source.DEFAULT
          assert agent.all_found is True
          assert bridge.get_planner_memory_context("equipment", "plan") == ""

          kernel = InlineExecutionKernel(
              lambda request: ExecutionResult(
                  request_id=request.request_id or "req-standalone",
                  run_id=request.effective_run_id or "run-standalone",
                  status="completed",
                  module=request.module,
                  pages=list(request.pages),
                  agent=request.agent,
                  mode=request.mode,
                  summary="standalone-ok",
              )
          )
          result = kernel.execute(
              KernelExecutionRequest(
                  context=ExecutionContext(
                      workspace_id="ws-1",
                      user_id="alice",
                      scopes=["execute"],
                      module="equipment",
                      pages=["alarm-config"],
                      agent="automation-agent",
                      mode="full",
                      provider="mock",
                      entrypoint="sdk",
                  ),
                  kind="agent",
                  run_id="run-standalone",
              )
          )
          assert alice_engine.__version__ == "1.0.0"
          assert result.status == "completed"
          assert result.run_id == "run-standalone"
          assert result.module == "equipment"
          print("standalone wheel smoke OK")
          PY

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, sdk-standalone]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aitest-platform:${{ github.sha }} .

      - name: Verify health endpoint
        run: |
          docker run -d --name aitest-ci -p 8000:8000 \
            -e ANTHROPIC_API_KEY=ci-test \
            aitest-platform:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/health || echo "Health check failed (expected without valid API key)"
          docker stop aitest-ci

  release:
    name: Release — Push image + Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, sdk-standalone]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            pyproject.toml
