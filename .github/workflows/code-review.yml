# AITest Platform — AI Code Review (using internalized Review Extension)
#
# PR 提交时自动触发代码审查
# 使用 Alice 自己的 RuleConfig + FileBundler + PositionVerifier

name: AI Code Review

on:
  pull_request:
    branches: [master, main, develop]
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    if: "!github.event.pull_request.draft"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整 git 历史来生成 diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic sqlalchemy chromadb \
            langgraph anthropic openai pyyaml python-dotenv httpx

      - name: Run AI Code Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "
          import json, sys, os
          from pathlib import Path

          # 导入 Review Extension
          sys.path.insert(0, '.')
          from alice_engine.extensions.review import RuleConfig, FileBundler

          # 获取变更文件列表
          import subprocess
          base = '${{ github.event.pull_request.base.sha }}'
          head = '${{ github.event.pull_request.head.sha }}'
          result = subprocess.run(
              ['git', 'diff', '--name-only', base, head],
              capture_output=True, text=True
          )
          changed_files = [f.strip() for f in result.stdout.strip().split('\n') if f.strip()]
          print(f'Changed files: {len(changed_files)}')

          # 规则匹配
          rules = RuleConfig(project_root=Path('.'))
          matched = rules.match_for_files(changed_files)
          print(f'Rules matched for {len(matched)} files')

          # 文件打包
          bundler = FileBundler()
          bundles = bundler.bundle(changed_files)
          print(f'Bundled into {len(bundles)} review units')

          # 输出结果
          output = {
              'changed_files': changed_files,
              'matched_rules': {k: v for k, v in matched.items()},
              'bundles': [{'id': b.bundle_id, 'files': b.files, 'reason': b.reason} for b in bundles],
              'rules_count': sum(len(v) for v in matched.values()),
          }
          with open('review-result.json', 'w') as f:
              json.dump(output, f, indent=2, ensure_ascii=False)

          print('Review analysis complete')
          "

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result;
            try {
              result = JSON.parse(fs.readFileSync('review-result.json', 'utf8'));
            } catch (e) {
              result = null;
            }

            if (!result) {
              console.log('No review result found');
              return;
            }

            const lines = ['## 🔍 AI Code Review Analysis\n'];

            lines.push(`**Changed files**: ${result.changed_files.length}`);
            lines.push(`**Rules matched**: ${result.rules_count} rules for ${Object.keys(result.matched_rules).length} files`);
            lines.push(`**Review bundles**: ${result.bundles.length}\n`);

            if (result.bundles.length > 0) {
              lines.push('### File Bundles');
              for (const bundle of result.bundles) {
                lines.push(`- **${bundle.id}** (${bundle.reason}): ${bundle.files.join(', ')}`);
              }
              lines.push('');
            }

            if (Object.keys(result.matched_rules).length > 0) {
              lines.push('### Matched Rules');
              for (const [file, instructions] of Object.entries(result.matched_rules)) {
                lines.push(`**${file}**:`);
                for (const instr of instructions) {
                  lines.push(`- ${instr}`);
                }
              }
            }

            const body = lines.join('\n');

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('AI Code Review Analysis'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
