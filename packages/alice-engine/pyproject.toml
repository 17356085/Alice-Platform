[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alice-engine"
version = "1.0.0"
description = "Alice Engine — AI 测试自动化 SDK"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
llm-anthropic = ["anthropic>=0.30.0"]
llm-openai = ["openai>=1.0"]
llm-all = [
    "anthropic>=0.30.0",
    "openai>=1.0",
]
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]
all = [
    "anthropic>=0.30.0",
    "openai>=1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["alice_engine*"]

[tool.setuptools.package-data]
alice_engine = [
    "governance_default/**/*.yaml",
    "governance_default/**/*.md",
    "runtime/core/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
