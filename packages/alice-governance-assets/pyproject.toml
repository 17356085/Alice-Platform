[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alice-governance-assets"
version = "1.0.0"
description = "Alice Engine — Governance Assets (knowledge + context templates)"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["alice_governance_assets*"]

[tool.setuptools.package-data]
alice_governance_assets = [
    "knowledge/**/*.md",
    "knowledge/**/*.yaml",
    "context_templates/**/*.yaml",
]
