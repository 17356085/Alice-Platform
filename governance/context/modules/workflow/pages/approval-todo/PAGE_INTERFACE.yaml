# PAGE_CONTEXT.md: 审批待办 (approval-todo)

## 页面概述
- **模块**: workflow
- **页面名称**: 审批待办 (approval-todo)
- **核心功能**: 展示、筛选、管理和处理待审批的流程列表。
- **技术栈线索**: 使用了 Ant Design 组件库 (如 `.ant-*` 类名)。

## 关键区域与可测元素

### 1. 筛选器区域
| 元素标识 | 选择器 (优先使用 `data-testid`) | 备选选择器 | 交互方式 | 关联测试点 |
| :--- | :--- | :--- | :--- | :--- |
| **流程类型下拉框** | `[data-testid="filter-processType"]` | `.ant-select:nth-of-type(1)` | 下拉选择 | AT-FLT-01 |
| **状态下拉框** | `[data-testid="filter-status"]` | `.ant-select:nth-of-type(2)` | 下拉选择 | AT-FLT-01 |
| **关键词输入框** | `[data-testid="filter-keyword"]` | `input[placeholder*="关键词"]` | 文本输入 | AT-FLT-02 |
| **开始日期** | `[data-testid="filter-startDate"]` | `.ant-picker:first-of-type` | 日期选择 | AT-FLT-03 |
| **结束日期** | `[data-testid="filter-endDate"]` | `.ant-picker:last-of-type` | 日期选择 | AT-FLT-03 |
| **查询按钮** | `[data-testid="btn-query"]` | `button:has-text("查询")` | 点击 | AT-FLT-01/02/03 |
| **重置按钮** | `[data-testid="btn-reset"]` | `button:has-text("重置")` | 点击 | AT-FLT-04 |

