## 测试注意事项
1.  **异步等待**: 任何触发数据变化的交互（查询、翻页、批量操作）后，必须等待 `.ant-spin-spinning` 消失后再进行断言。
2.  **定位器策略**: 优先使用 `[data-testid]`。对于表格行内元素，建议采用 `.ant-table-row:nth-child({行号})` 结合具体元素选择器的方式。
3.  **状态断言**: 批量操作按钮的启用/禁用状态、全选复选框的半选状态，是重要的验证点。
4.  **数据依赖**: 部分测试用例（如筛选、单条操作）需要特定状态的数据前置，请确保测试数据集包含“待我审批”状态的记录。
5.  **弹窗处理**: “同意”、“拒绝”操作很可能触发二次确认弹窗，测试中需要定位并操作弹窗内的确认按钮。