version: "3.8"

# Production baseline. Secrets must be injected by the deployment platform;
# this file intentionally has no development password fallback.
services:
  aitest:
    build: .
    environment:
      AITEST_PRODUCTION: "1"
      AITEST_DB_BACKEND: postgres
      AITEST_DATABASE_URL: postgresql://aitest:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/aitest
      REDIS_URL: redis://redis:6379/0
      AITEST_API_KEY: ${AITEST_API_KEY:?AITEST_API_KEY is required}
      AITEST_WORKER_AUTH_REQUIRED: "1"
      AITEST_WORKER_AUTH_SECRET: ${AITEST_WORKER_AUTH_SECRET:?AITEST_WORKER_AUTH_SECRET is required}
      AITEST_RBAC_REQUIRED: "1"
      AITEST_PLUGIN_REQUIRE_SIGNATURE: "1"
      AITEST_OTEL_ENABLED: ${AITEST_OTEL_ENABLED:-true}
      AITEST_OTEL_ENDPOINT: ${AITEST_OTEL_ENDPOINT:-http://jaeger:4317}
    ports:
      - "${AITEST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: ["rq", "worker", "aitest-tasks", "--url", "redis://redis:6379/0"]
    environment:
      AITEST_PRODUCTION: "1"
      AITEST_DB_BACKEND: postgres
      AITEST_DATABASE_URL: postgresql://aitest:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/aitest
      REDIS_URL: redis://redis:6379/0
      AITEST_API_KEY: ${AITEST_API_KEY:?AITEST_API_KEY is required}
      AITEST_WORKER_AUTH_REQUIRED: "1"
      AITEST_WORKER_AUTH_SECRET: ${AITEST_WORKER_AUTH_SECRET:?AITEST_WORKER_AUTH_SECRET is required}
      AITEST_RBAC_REQUIRED: "1"
      AITEST_PLUGIN_REQUIRE_SIGNATURE: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
    volumes:
      - ${TEST_PROJECT_PATH:-./demo}:/app/project:ro
      - ./governance:/app/governance:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aitest
      POSTGRES_USER: aitest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitest -d aitest"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      aitest:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  prometheus_data:
